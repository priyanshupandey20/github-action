
name: CICD

on:
  workflow_dispatch:
      inputs:
        environment:
            description: This is the environment value where this workflow runs
            default: 'dev'
            required: true
            type: choice
            options:
              - dev
              - prod
              - staging

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: echo "Clone the code from GitHub"

  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build the Docker container
        run: echo "Docker container build"

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Test the container
        run: echo "Testing"

  deploy:
    if: inputs.environment == 'dev'
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the code
        run: echo "Deploy successfully"
