
name: Deploy Flask App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Hub Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USER }}" \
            --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USER }}/github-actions-app:latest .

      - name: Push Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USER }}/github-actions-app:latest

      - name: Deploy with Docker Compose
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        run: |
          docker compose -f "$GITHUB_WORKSPACE/docker-compose.yml" pull
          docker compose -f "$GITHUB_WORKSPACE/docker-compose.yml" up -d

      - name: Check Running Containers
        run: docker ps
