name: Portfolio

on: 
    push: 
        branches: [main]
    workflow_dispatch:

permissions:
    pages: write
    id-token: write
    
jobs:
    deploy:
        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{ steps.deplayment.outputs.page_url }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Github Page
              uses: actions/configure-pages@v

            - name: Upload static page
              uses: actions/upload-pages-artifact@v4
              with:
                path: "."

            - name: Deploy to Gitub pages
              uses: actions/deploy-pages@v4
              
