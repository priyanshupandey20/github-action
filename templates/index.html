
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Zero To Hero</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 45px 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .status {
            display: inline-block;
            background: #e8f7ed;
            color: #218838;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .status span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #28a745;
            border-radius: 50%;
            margin-right: 6px;
        }

        h1 {
            font-size: 32px;
            color: #202b3c;
            margin-bottom: 12px;
        }

        .description {
            font-size: 15px;
            color: #777;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .details {
            background: #f8f9fb;
            border: 1px solid #e9edf2;
            border-radius: 8px;
            text-align: left;
            padding: 20px;
        }

        .detail {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        .detail:last-child {
            border-bottom: none;
        }

        .label {
            color: #777;
        }

        .value {
            color: #202b3c;
            font-weight: 600;
            text-align: right;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999;
        }

        @media (max-width: 480px) {
            .container {
                padding: 35px 20px;
            }

            h1 {
                font-size: 26px;
            }

            .detail {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="status">
            <span></span> Application Running Successfully
        </div>

        <h1>DevOps Zero To Hero</h1>

        <p class="description">
            Welcome! Your Flask application has been successfully
            deployed and is running on AWS.
        </p>

        <div class="details">

            <div class="detail">
                <span class="label">Framework</span>
                <span class="value">Flask 3.1</span>
            </div>

            <div class="detail">
                <span class="label">Runtime</span>
                <span class="value">Python 3.14</span>
            </div>

            <div class="detail">
                <span class="label">Deployment</span>
                <span class="value">AWS ECS</span>
            </div>

        </div>

        <footer>
            DevOps Zero To Hero &copy; 2026
        </footer>

    </div>

</body>
</html>
